name: publish
on:
  push:
    branches: [staging]
    tags: ['llmcli/v*']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  actions: read
jobs:
  # Gate staging-branch publishes on CI success (audit 2026-07-01: satellites published
  # ungated on push, so a red-CI staging merge could ship a broken image to GHCR). Tag
  # releases and manual dispatch publish directly (the gate is skipped for them).
  ci-gate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    steps:
      - name: Require CI success for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha='${{ github.sha }}'
          echo "Waiting for CI (ci.yml) to conclude for ${sha}..."
          for i in $(seq 1 60); do
            run=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${sha}&per_page=1" \
                    --jq '.workflow_runs[0] | "\(.status)|\(.conclusion // "")"' 2>/dev/null || echo '|')
            status="${run%%|*}"; conclusion="${run#*|}"
            echo "  CI: status='${status}' conclusion='${conclusion}'"
            if [ "${status}" = "completed" ]; then
              [ "${conclusion}" = "success" ] && { echo "CI green -> publishing."; exit 0; }
              echo "::error::CI concluded '${conclusion}' for ${sha} -> refusing to publish a possibly-broken image."
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out (~30 min) waiting for CI on ${sha}."
          exit 1
  # A job that calls a reusable workflow cannot also mint a token: the app
  # token is produced here and passed as a secret, not a build-arg.
  git-token:
    name: Mint private-repo token
    needs: [ci-gate]
    if: ${{ always() && needs.ci-gate.result != 'failure' && needs.ci-gate.result != 'cancelled' }}
    runs-on: ubuntu-latest
    outputs:
      token: ${{ steps.app.outputs.token }}
    steps:
      - name: Mint a token for the private roxabi-inference dependency
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.ROXABI_CI_APP_ID }}
          private-key: ${{ secrets.ROXABI_CI_APP_PRIVATE_KEY }}
          owner: Roxabi
          repositories: roxabi-inference
  publish:
    needs: [ci-gate, git-token]
    # Run when the gate passed (staging) OR was skipped (tag push / manual dispatch),
    # and the app token was minted. Never publish without it: the image build
    # clones private Roxabi/roxabi-inference.
    if: ${{ always() && needs.ci-gate.result != 'failure' && needs.ci-gate.result != 'cancelled' && needs.git-token.result == 'success' }}
    uses: Roxabi/.github/.github/workflows/publish-container.yml@staging
    secrets:
      git_token: ${{ needs.git-token.outputs.token }}
    with:
      image_name: ghcr.io/roxabi/llmcli
      release_please_component: llmcli
      dockerfile_path: ./deploy/Dockerfile.llm
